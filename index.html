<!DOCTYPE html>
<html>
<head>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap');
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background: #ffffff; /* Sfondo Bianco */
            font-family: 'Inter', sans-serif; 
        }

        .container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        .magnetic-text {
            display: flex;
            user-select: none;
            padding: 0 50px;
        }

        .letter {
            display: inline-block;
            font-size: 18vw; /* Dimensione bilanciata */
            font-weight: 900;
            line-height: 1.2;
            letter-spacing: -0.06em;
            color: #000000; /* Testo Nero Solido */
            
            /* Transizione fluida anti-tremolio */
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            pointer-events: auto;
            white-space: pre;
            
            /* Forza la pulizia dei bordi */
            overflow: visible;
        }
    </style>
</head>
<body>

<div class="container" id="hero">
    <h1 class="magnetic-text" id="word">PORTFOLIO</h1>
</div>

<script>
    const word = document.getElementById('word');
    const textContent = "PORTFOLIO";
    word.innerHTML = '';

    // Creazione dinamica delle lettere per l'interazione individuale
    const letters = textContent.split('').map(char => {
        const span = document.createElement('span');
        span.innerText = char;
        span.className = 'letter';
        word.appendChild(span);
        return span;
    });

    document.addEventListener('mousemove', (e) => {
        const mouseX = e.clientX;
        const mouseY = e.clientY;

        letters.forEach(letter => {
            const rect = letter.getBoundingClientRect();
            const letterX = rect.left + rect.width / 2;
            const letterY = rect.top + rect.height / 2;

            const distX = mouseX - letterX;
            const distY = mouseY - letterY;
            const distance = Math.sqrt(distX * distX + distY * distY);

            // Raggio di attrazione/repulsione delle lettere
            const radius = 200;

            if (distance < radius) {
                const force = (radius - distance) / radius;
                
                // Spostamento X e Y
                const moveX = (distX / distance) * force * -45;
                const moveY = (distY / distance) * force * -45;
                
                // Rotazione per un effetto più organico
                const rotZ = (distX / radius) * 12;

                letter.style.transform = `translate3d(${moveX}px, ${moveY}px, 0) rotateZ(${rotZ}deg) scale(${1 + force * 0.05})`;
            } else {
                // Ritorno alla posizione di riposo
                letter.style.transform = `translate3d(0, 0, 0) rotateZ(0deg) scale(1)`;
            }
        });
    });

    // Reset quando il mouse esce dall'area visibile
    document.addEventListener('mouseleave', () => {
        letters.forEach(letter => {
            letter.style.transform = `translate3d(0, 0, 0) rotateZ(0deg) scale(1)`;
        });
    });
</script>

</body>
</html>
